<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Lucky Draw</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #fff;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .slot-machine {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border-radius: 30px;
            padding: 40px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.1),
                inset 0 -2px 0 rgba(0,0,0,0.5);
            border: 4px solid #ffd700;
            margin-bottom: 40px;
            position: relative;
        }

        .lights {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-around;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: blink 0.5s ease infinite alternate;
        }

        .light:nth-child(odd) {
            animation-delay: 0.25s;
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; box-shadow: 0 0 10px currentColor; }
        }

        .slots-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .slot {
            width: 200px;
            height: 150px;
            background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow:
                inset 0 5px 15px rgba(0,0,0,0.2),
                0 5px 20px rgba(0,0,0,0.3);
            border: 4px solid #ffd700;
        }

        .slot::before,
        .slot::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 30px;
            z-index: 2;
            pointer-events: none;
        }

        .slot::before {
            top: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
        }

        .slot::after {
            bottom: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 100%);
        }

        .slot-window {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .slot-reel {
            position: absolute;
            width: 100%;
            will-change: transform;
        }

        .slot-item {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            text-align: center;
            padding: 10px;
            word-wrap: break-word;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .draw-button {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 30px rgba(255,215,0,0.4),
                0 5px 0 #cc8800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .draw-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow:
                0 15px 40px rgba(255,215,0,0.5),
                0 7px 0 #cc8800;
        }

        .draw-button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow:
                0 5px 20px rgba(255,215,0,0.3),
                0 2px 0 #cc8800;
        }

        .draw-button:disabled {
            background: linear-gradient(145deg, #888, #666);
            box-shadow: 0 5px 0 #444;
            cursor: not-allowed;
        }

        .result-display {
            margin-top: 30px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .result-display.show {
            opacity: 1;
            transform: translateY(0);
        }

        .winners {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .winner {
            background: linear-gradient(145deg, #fff, #f0f0f0);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: winnerAppear 0.5s ease forwards;
            opacity: 0;
        }

        .winner:nth-child(1) { animation-delay: 0.1s; }
        .winner:nth-child(2) { animation-delay: 0.3s; }
        .winner:nth-child(3) { animation-delay: 0.5s; }

        .winner-name {
            font-size: 2.5rem;
            font-weight: bold;
            color: #764ba2;
        }

        @keyframes winnerAppear {
            from {
                opacity: 0;
                transform: scale(0.5) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
            50% { box-shadow: 0 0 40px rgba(255,215,0,0.8), 0 0 60px rgba(255,215,0,0.4); }
        }

        .slot-machine.spinning .slot {
            animation: glow 0.5s ease infinite;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall linear forwards;
            z-index: 1000;
        }

        @keyframes confettiFall {
            to {
                top: 100vh;
                transform: rotate(720deg);
            }
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1rem; }

            .slot-machine { padding: 20px; }
            .lights { display: none; }

            /* Stack slots vertically on small screens */
            .slots-container {
                flex-direction: column;
                gap: 15px;
            }

            .slot {
                width: 280px;
                height: 80px;
            }

            .slot::before,
            .slot::after {
                height: 15px;
            }

            .slot-item {
                height: 80px;
                font-size: 1.1rem;
            }

            .draw-button {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .result-display {
                padding: 20px;
            }

            .winner-name {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.9rem; }
            .slot { width: 260px; height: 70px; }
            .slot-item { height: 70px; font-size: 1rem; }
            .winner-name { font-size: 1.2rem; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .slot { width: 160px; height: 120px; }
            .slot-item { height: 120px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MP Lab Lucky Draw</h1>
        <p class="subtitle">Spin to pick 3 random members!</p>

        <div class="slot-machine" id="slotMachine">
            <div class="lights">
                <div class="light" style="background: #ff0000;"></div>
                <div class="light" style="background: #00ff00;"></div>
                <div class="light" style="background: #0000ff;"></div>
                <div class="light" style="background: #ffff00;"></div>
                <div class="light" style="background: #ff00ff;"></div>
                <div class="light" style="background: #00ffff;"></div>
                <div class="light" style="background: #ff0000;"></div>
                <div class="light" style="background: #00ff00;"></div>
            </div>

            <div class="slots-container">
                <div class="slot">
                    <div class="slot-window">
                        <div class="slot-reel" id="reel1"></div>
                    </div>
                </div>
                <div class="slot">
                    <div class="slot-window">
                        <div class="slot-reel" id="reel2"></div>
                    </div>
                </div>
                <div class="slot">
                    <div class="slot-window">
                        <div class="slot-reel" id="reel3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="draw-button" id="drawButton" onclick="startDraw()">
                Start Draw
            </button>
        </div>

        <div class="result-display" id="resultDisplay">
            <div class="winners" id="winners"></div>
        </div>
    </div>

    <script>
        let members = [];
        let isDrawing = false;
        // Get actual item height from DOM
        function getItemHeight() {
            const testItem = document.querySelector('.slot-item');
            if (testItem) {
                return testItem.offsetHeight;
            }
            // Fallback if no slot-item exists yet
            if (window.innerWidth <= 480) return 70;
            if (window.innerWidth <= 768) return 80;
            if (window.innerWidth <= 1024) return 120;
            return 150;
        }
        const BASE_SPIN_DURATION = 4000;

        // Fetch and parse CSV
        async function loadMembers() {
            try {
                const response = await fetch('lab_members.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const csvText = await response.text();
                console.log('CSV raw text:', csvText);

                const lines = csvText.split('\n');
                members = lines
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => {
                        // Remove line numbers if present (e.g., "1→Name" or "1 Name")
                        return line.replace(/^\d+→?\s*/, '').trim();
                    })
                    .filter(name => name.length > 0);

                console.log('Loaded members:', members);
                console.log('Total members:', members.length);

                if (members.length === 0) {
                    throw new Error('No members found in CSV');
                }

                initializeReels();
            } catch (error) {
                console.error('Error loading CSV:', error);
                // Fallback members
                members = [
                    'Shi Yiming', 'Man Christopher', 'Tian Haoyu', 'Kong Xianghui', 'Wang Yinghui',
                    'Zhu Jiarui', 'Li Zhichun', 'Zhang Fan', 'Jiang Yufeng', 'Jerry Ching',
                    'Wang Xiang', 'Yu Peixin', 'Xiong Tianyu', 'Lai Qingpei', 'Liu Chenyang',
                    'Song Liming', 'Hu Dianlin', 'Liao Weihang', 'Wang Peilin', 'Ni Yimin',
                    'Cao Jin', 'Teng Xinzhi', 'Zhao Mayang', 'Ma Benteng', 'Wu Jiaming',
                    'Pu Yao', 'Zhang Xinyu', 'Shi Zihan', 'Zhang Zhenxi', 'Zhuang Yitao',
                    'Zhou Pujun', 'Lu Yao', 'Yu Qin', 'Chen Zhi', 'He Yaotian'
                ];
                console.log('Using fallback members list');
                initializeReels();
            }
        }

        function initializeReels() {
            // SVG question mark icon
            const questionMarkSVG = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
                    <circle cx="50" cy="50" r="45" fill="#667eea" opacity="0.2"/>
                    <text x="50" y="70" font-size="60" text-anchor="middle" fill="#667eea" font-weight="bold">?</text>
                </svg>
            `;

            for (let i = 1; i <= 3; i++) {
                const reel = document.getElementById(`reel${i}`);
                reel.innerHTML = '';
                // Display SVG question mark initially
                const item = document.createElement('div');
                item.className = 'slot-item';
                item.innerHTML = questionMarkSVG;
                reel.appendChild(item);
                reel.style.transform = 'translateY(0px)';
            }
        }

        function getRandomMembers(count) {
            const shuffled = [...members].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        async function startDraw() {
            if (isDrawing || members.length === 0) return;

            isDrawing = true;
            const drawButton = document.getElementById('drawButton');
            const resultDisplay = document.getElementById('resultDisplay');
            const slotMachine = document.getElementById('slotMachine');

            drawButton.disabled = true;
            drawButton.textContent = 'Drawing...';
            resultDisplay.classList.remove('show');
            slotMachine.classList.add('spinning');

            // Get 3 unique winners
            const winners = getRandomMembers(3);

            // Spin all reels with different stop times
            const spinPromises = [1, 2, 3].map((index) =>
                spinSlot(index, winners[index - 1], 3000 + (index * 1000))
            );

            await Promise.all(spinPromises);

            // Show results
            await showResults(winners);

            // Reset
            slotMachine.classList.remove('spinning');
            drawButton.disabled = false;
            drawButton.textContent = 'Draw Again';
            isDrawing = false;
        }

        function spinSlot(reelIndex, winner, duration) {
            return new Promise(resolve => {
                const reel = document.getElementById(`reel${reelIndex}`);
                const extraSpins = 30; // Number of full rotations
                const itemHeight = getItemHeight();

                // Reset reel to top position first
                reel.style.transform = 'translateY(0px)';

                // Create a long reel with random names + winner at the end
                const tempMembers = [];
                for (let i = 0; i < extraSpins; i++) {
                    tempMembers.push(members[Math.floor(Math.random() * members.length)]);
                }
                tempMembers.push(winner);

                // Clear and rebuild reel
                reel.innerHTML = '';
                tempMembers.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'slot-item';
                    item.textContent = member;
                    reel.appendChild(item);
                });

                // Force reflow to ensure styles are applied
                void reel.offsetHeight;

                // Start from top
                const startPosition = 0;
                const targetPosition = -(tempMembers.length - 1) * itemHeight;
                const totalDistance = Math.abs(targetPosition - startPosition);

                let startTime = null;

                // Custom easing function for slow-stop effect (ease-out-cubic)
                function easeOutCubic(t) {
                    return 1 - Math.pow(1 - t, 3);
                }

                function animate(currentTime) {
                    if (!startTime) startTime = currentTime;
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Apply easing for gradual slowdown
                    const easedProgress = easeOutCubic(progress);
                    const currentPos = startPosition - (totalDistance * easedProgress);

                    reel.style.transform = `translateY(${currentPos}px)`;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        resolve();
                    }
                }

                requestAnimationFrame(animate);
            });
        }

        async function showResults(winners) {
            const winnersDiv = document.getElementById('winners');
            const resultDisplay = document.getElementById('resultDisplay');

            winnersDiv.innerHTML = winners.map(winner => `
                <div class="winner">
                    <div class="winner-name">${winner}</div>
                </div>
            `).join('');

            resultDisplay.classList.add('show');
            launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffd700'];

            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', loadMembers);

        // Re-initialize on window resize with debounce
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (!isDrawing) {
                    initializeReels();
                }
            }, 250);
        });
    </script>
</body>
</html>
